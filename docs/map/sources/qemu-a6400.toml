[[claim]]
id = "C17"
entities = ["qemu.submicro"]
status = "verified-offline"
text = "POWER on the a6400 is a sub-micro front key (CAkey1 bit 0, active low); the guest key table also lists active-low GPIO keys P0.3/P0.4/P0.7/P0.10/P0.11/P1.1, switch P9.22 and ADC ladders on channels 0xC/0xF/0x10/0x11. SIO (5 channels at 0xF2405000, IRQ 201+ch), GPIO (18 ports at 0xF2910000) and ADC models were ported from Oein/a5000-emulator (GPL-2.0, attributed)."
evidence = ["E0526:qemu"]

[[claim]]
id = "C18"
entities = ["qemu.avcam-sequencer"]
status = "verified-offline"
text = "The imager was failing its own clock init before any sensor transfer: ulog RAM showed 'Leo Clkgen PLL Wait' timeouts and MIPI-Tx D-PHY init errors. Leo lock is status bit 0 at 0xFC021000 +0x50/+0x54/+0x58 after enable bits 0/4/8 of +0x000; mapping that page and the D-PHY LWAITSTAT bit lets the PLL and D-PHY lock, while the sensor writer stays idle."
evidence = ["E0534:qemu"]

[[claim]]
id = "C19"
entities = ["qemu.display"]
status = "verified-offline"
text = "The panel showed the viewfinder layout because GPIO P0.2 (the active-low EVF eye-contact sensor, KEY_OTHER_EYE_CONTACT 0x708B) was missing from the board's reset-high list; idling it high lets stock firmware select the rear-LCD layouts (LayoutST_NORMAL_WITH_INFO_LR etc.) without a diagnostic overlay. Changing the backup output-device bytes or forcing isOutputEvf did not switch the panel; isOutputEvf only moves coordinates inside a layout."
evidence = ["E0536", "E0540", "E0541", "E0542", "E0651"]

[[claim]]
id = "C20"
entities = ["qemu.display"]
status = "verified-offline"
text = "A late all-black panel is the guest's own power-save: when Power Save Start Time expires (1 min default, 10 s when selected) the firmware stops drawing and mutes VPH scanout; QEMU is not failing to show an active buffer."
evidence = ["E0574", "E0652"]

