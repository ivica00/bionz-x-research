[[claim]]
id = "C23"
entities = ["qemu.board", "qemu.display", "qemu.avcam-sequencer", "qemu.submicro"]
status = "verified-offline"
text = "Opt-in QEMU codec, storage, sensor, and MMIO models retire all remaining E0705 unmodelled MMIO pairs (0 distinct unmodelled lines in live full-peripheral boot), replace plain ZERO/read-back clock/reset/PBL windows with stateful 0x10-stride STAT/SET/CLR banks (clkrst-model=on: 0xF280/0xF290/0xF2A0..0xF2A32, ZMA0/RC0/SA4), advance av-cam naturally past step 26 to step 42 (0x0102) without GATE_FORCE_PROBE or ENTRY_FORCE_PROBE via stateful sub-micro lens-rail latching, fix 256-byte SPI Slot-C selection to retire ILCE-6400A 0x63909ba8 ('S-Ele Refresh ng') and reach sustained bars live-view with IDT_CAM, mount 4 GiB UHS-I U3 SDR104 SDHC cards via CMD11 + SCR[33] CMD23 + CMD19 tuning + mmc0-vendor (mmca10: p1), wire sub-micro Slot A[29] BIT(6) HDMI HPD, correlate P2S Ch 0/1 bursts with 13-column IMX284 mode tables (Column 3, 1996x570), and implement baseline 4:2:2/4:2:0 JPEG decode (op=0x11), ECS encode (op=0x1B), RC0 UYVY resize, VPH UYVY RGB888 scanout, ARW 2.3 cRAW2 (0xF3030000), and SFRS/DVENC movie HLE."
evidence = ["E0705", "E0706", "E0715"]

